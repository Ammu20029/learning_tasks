<!DOCTYPE html>
<html>
    <head>
        <title>Form attributes</title>
    </head>
    <body>
        <form action=”/action_page.php” method=”get”>
            <label for=”fname”>First Name:</label>
            <input type=”text” id=”fname” name=”fname”><br><br>
            <label for=”lname”>Last Name:</label>
            <input type=”text” id=”lname” name=”lname” disabled><br><br>
            <label for=”uname”>Username:</label>
            <input type=”text” id=”uname” name=”uname” required><br><br>
            <label for =”pwd”>Password:</label>
            <input type=”password”id=”pwd”name=”pwd”><br><br>
            <label for=”email”>Enter email:</label>
            <input type=”email” id=”email” name=”email readonly><br><br>
            <label for =”quantity”>Quantity(1 and 5):</label>
            <input type=”number” id= “quantity” name= “quantity” min=”1” max=”5”><br><br>
            <label for=”birthday”>Birthday:</date>
            <input type=”date” id=”birthday” name=”birthday”><br><br> 
            <label for=”phone”>Enter a phone number:</label><br><br>
            <input type =”tel” id=”phone” name=”phone” placeholder=”123-45-678”
            Pattern=”[0-9]{3}-[0-9]{2}-[0-9]{3}”><br><br>
            <small>format:123-45-678</small><br><br>
            <input type=”radio” id= “Telugu” name=”fav_lang” value=”Telugu”>
            <label for=”Telugu”>Telugu</label>
            <input type=”radio” id= “Hindi” name=”fav_lang” value=”Hindi”>
            <label for=”Hindi”>Hindi </label>
            <input type=”radio” id= “English” name=”fav_lang” value=”English”>
            <label for=”English”>English</label>
            <input type=”checkbox” id=”Gender” name=”Gender” value=”Male”>
            <label for =”Male”>I am Male</label>
            <input type=”checkbox” id=”Gender” name=”Gender” value=”Female”>
            <label for =”Female”>I am Female</label>
            <label for “cars”> choose a car:</label>
            <select name= “cars” id= “cars”>
            <optgroup label=”Swedish Cars”>
            <option value=”Volvo”>Volvo</option>
            <option value=”saab”> Saab</option>
            </optgroup>
            <optgroup label=”German Cars”>
            <option value=”Mercedes”>Mercedes</option>
            <option value =”audi”>Audi</option>
            </optgroup>
            </select>
            <label  for=”textarea_review”>The <textarea> element in HTML creates a multi-line text input field. To make it display two lines, you set the rows attribute to 2, which controls its height. You can also adjust its width using the cols attribute or CSS styling</label>
            <textarea id= “textarea_review”name=”textarea_review” rows=”2” cols=”2”> Todays tasks include form attributes.</textarea>
            <input type=”submit” value =”submit”>
            </form>
            
    </body>
</html>
